name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright Cucumber Regression Tests
      if: contains(github.event.head_commit.message,'[login]')
      run: |
        npx cucumber-js --config=playwright.config.js --tags='@login'
      env:
          BASE_URL: ${{secrets.BASE_URL}}
    - name: Run Playwright Cucumber Search Tests
      if: contains(github.event.head_commit.message, '[search]')
      run: |
        npx cucumber-js --config=playwright.config.js --tags='@search'
    - name: Generate Allure Report
      if: always()
      run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean
    - name: Publish Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      #if: ${{ !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30